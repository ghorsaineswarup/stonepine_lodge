<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Stonepine Lodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
<div id="header-root"></div>

<section class="pad">
  <div class="wrap">
    <div class="authcard">
      <h2 style="font-size:26px;margin-bottom:8px;">Create your account</h2>
      <p style="color:var(--ink-soft);font-size:14px;margin-bottom:24px;">Book faster and keep track of your stays.</p>
      <div class="formerror" id="r-error"></div>
      <div class="field"><label>Full name</label><input type="text" id="r-name"></div>
      <div class="field"><label>Email</label><input type="email" id="r-email"></div>
      <div class="field"><label>Password</label><input type="password" id="r-pass" placeholder="At least 6 characters"></div>
      <button class="btn btn-primary btn-block" id="r-submit" style="width:100%;">Create account</button>
      <div class="authswitch" style="text-align:center;margin-top:18px;font-size:13.5px;color:var(--ink-soft);">Already have one? <a href="/login.html" style="color:var(--ember-600);font-weight:600;">Log in</a></div>
    </div>
  </div>
</section>

<div id="footer-root"></div>
<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script>
document.getElementById('r-submit').addEventListener('click', async () => {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-pass').value;
  const errorBox = document.getElementById('r-error');
  const btn = document.getElementById('r-submit');

  errorBox.classList.remove('show');
  if (!name || !email || !password) {
    errorBox.textContent = 'Fill in all fields.';
    errorBox.classList.add('show');
    return;
  }
  if (password.length < 6) {
    errorBox.textContent = 'Password must be at least 6 characters.';
    errorBox.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account…';
  try {
    const { token, user } = await api('/auth/register', { method: 'POST', body: { name, email, password } });
    setSession(token, user);
    window.location.href = '/account.html';
  } catch (err) {
    errorBox.textContent = err.message || 'Could not create account - try again.';
    errorBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
